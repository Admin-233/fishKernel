[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fishkernel"
version = "0.3.0"
description = "让大模型无限循环运行的内核"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openai>=1.40"]
keywords = ["agent", "llm", "deepseek", "autonomous", "kernel"]

[project.urls]
Homepage = "https://github.com/Admin-233/fishKernel"
Repository = "https://github.com/Admin-233/fishKernel.git"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
fishkernel = "fishkernel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
